# fly.toml app configuration file generated for thom-server on 2025-01-15T14:32:57-08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'thom-server'
primary_region = 'lax'

[build]

[env]
  DB_PATH = '/data/thom.db'

[mounts]
  source = 'thom_data'
  destination = '/data'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
